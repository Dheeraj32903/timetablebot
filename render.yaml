services:
  - type: web
    name: klu-timetable-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AUTHORIZED_TELEGRAM_USER_IDS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "klu_timetable_bot"
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: MORNING_TIMETABLE_HOUR
        value: "7"
      - key: MORNING_TIMETABLE_MINUTE
        value: "0"

