version: '3.8'

services:
  timetablebot:
    build: .
    container_name: klu_timetable_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist local database, encrypted credentials, and keys across container rebuilds
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json
      - ./.secret.key:/app/.secret.key
      - ./.morning_enabled:/app/.morning_enabled

